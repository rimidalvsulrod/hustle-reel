<!doctype html>
<html><head><meta charset="utf-8"><title>NEQO Ultra $999 reel</title>
<!-- Light-theme motion graphics for the NEQO Digital Ultra ($999/mo) reel. Driven by build/timeline.js (VO-synced
     word times); ../reel/render.cjs calls window.build() once, then window.seek(t) per frame. -->
<style>
@font-face{font-family:I;src:url(build/fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:I;src:url(build/fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:I;src:url(build/fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:I;src:url(build/fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:I;src:url(build/fonts/Inter-900.ttf);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F8F9FD;font-family:I,sans-serif;color:#0B1033;-webkit-font-smoothing:antialiased}
#bg,#cam,#over,#fx,#grain,.scene,.inner{position:absolute;inset:0}
.abs{position:absolute}
.row{display:flex;align-items:center}
.hl{position:absolute;left:84px;right:84px;text-align:center;font-weight:900;line-height:1.04;letter-spacing:-.042em;color:#0B1033;white-space:nowrap}
.w{display:inline-block;padding:.03em .03em .1em;margin:0 -.03em}
.w.g{background-image:linear-gradient(90deg,#2563EB 0%,#7C3AED 38%,#DB2777 70%,#F97316 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:absolute;background:rgba(255,255,255,.95);border:1.5px solid rgba(225,230,243,.95);border-radius:40px;box-shadow:0 34px 90px rgba(37,64,180,.13),0 6px 18px rgba(11,16,51,.05)}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:12px 26px;font-weight:700;white-space:nowrap}
.chip{position:absolute;display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:14px 26px;font-weight:700;font-size:30px;white-space:nowrap;background:#fff;color:#0B1033;border:1.5px solid #E3E7F2;box-shadow:0 18px 44px rgba(37,64,180,.14)}
.tag{position:absolute;z-index:3;font-weight:800;font-size:23px;letter-spacing:.1em;color:#4B5373;background:#E6E9F2;border:1.5px solid #C9CFE0;border-radius:999px;padding:6px 14px}
.disc{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;background:linear-gradient(135deg,#2563EB 0%,#7C3AED 50%,#DB2777 100%)}
.muted{color:#5B6382}
</style></head>
<body><svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset=".45" stop-color="#7C3AED"/><stop offset=".75" stop-color="#DB2777"/><stop offset="1" stop-color="#F97316"/></linearGradient>
  <linearGradient id="gh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563EB"/><stop offset=".4" stop-color="#7C3AED"/><stop offset=".72" stop-color="#DB2777"/><stop offset="1" stop-color="#F97316"/></linearGradient>
</defs></svg>
<div id="bg"></div><div id="cam"></div><div id="over"></div><div id="fx"></div><div id="grain"></div>
<script src="build/timeline.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/logo.js"></script>
<script>
const TL = window.TL, BG = document.getElementById('bg'), CAM = document.getElementById('cam'), OVER = document.getElementById('over'), FX = document.getElementById('fx');
const LN = Object.fromEntries(TL.lines.map((l) => [l.id, l]));
const INK = '#0B1033', SLATE = '#5B6382', MINT = '#12B76A', GOLD = '#F5B301', CORAL = '#F2575B';
const GRAD = 'linear-gradient(90deg,#2563EB 0%,#7C3AED 38%,#DB2777 70%,#F97316 100%)';
const GRAD135 = 'linear-gradient(135deg,#2563EB 0%,#7C3AED 45%,#DB2777 80%,#F97316 100%)';
const ico = (n, sz = 32, col = 'currentColor', sw = 2.2) =>
  `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block">${ICONS[n]}</svg>`;
const gtxt = (s) => `<span style="background:${GRAD};-webkit-background-clip:text;background-clip:text;color:transparent">${s}</span>`;

// ---------------------------------------------------------------- tiny deterministic animation engine
const E = {lin: (x) => x, out: (x) => 1 - (1 - x) ** 3, inn: (x) => x ** 3, io: (x) => (x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
  back: (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2, expo: (x) => (x >= 1 ? 1 : 1 - 2 ** (-10 * x))};
const ELS = new Map(), HOOKS = [], SFX = [], SHAKES = [], HLS = [];
const DEF = {x: 0, y: 0, s: 1, sx: 1, r: 0, o: 1, b: 0, sk: 0};
function K(el, prop, ...keys) {  // keys: [time, value, easing-into-this-key]
  let s = ELS.get(el); if (!s) ELS.set(el, s = {});
  (s[prop] = s[prop] || []).push(...keys); s[prop].sort((a, b) => a[0] - b[0]);
}
function val(k, t) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t < k[i][0]) {
    const [a, va] = k[i - 1], [b, vb, e] = k[i]; return va + (vb - va) * E[e || 'out']((t - a) / (b - a));
  }
  return k[k.length - 1][1];
}
function seek(t) {
  for (const [el, s] of ELS) {
    const v = {...DEF}; for (const p in s) v[p] = val(s[p], t);
    el.style.opacity = v.o; el.style.visibility = v.o < .002 ? 'hidden' : 'visible';
    el.style.transform = `translate(${v.x}px,${v.y}px) rotate(${v.r}deg) skewX(${v.sk}deg) scale(${v.s * v.sx},${v.s})`;
    el.style.filter = v.b > .05 ? `blur(${v.b.toFixed(2)}px)` : 'none';
  }
  let dx = 0, dy = 0;
  for (const [t0, a] of SHAKES) if (t >= t0) { const q = t - t0, d = a * Math.exp(-q * 10); dx += d * Math.sin(q * 71); dy += d * Math.cos(q * 53); }
  CAM.style.transform = OVER.style.transform = `translate(${dx}px,${dy}px)`;
  for (const h of HOOKS) h(t);
}
function $(tag, cls, parent, css, html) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html;
  parent.appendChild(e); return e;
}
const sfx = (t, type, p = 0) => SFX.push([+t.toFixed(3), type, p]);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
function reveal(el, t, d = .3, dy = 40) {
  K(el, 'o', [t, 0], [t + d * .6, 1]); K(el, 'b', [t, 10], [t + d, 0]); K(el, 'y', [t, dy], [t + d, 0]); K(el, 's', [t, .96], [t + d, 1]);
}
function pop(el, t, from = .5, snd = 0) {
  K(el, 'o', [t, 0], [t + .1, 1]); K(el, 's', [t, from], [t + .42, 1, 'back']); K(el, 'b', [t, 8], [t + .2, 0]);
  if (snd !== null) sfx(t, 'pop', snd);
}
function slide(el, t, dx, dy, d = .5, ease = 'out') { K(el, 'o', [t, 0], [t + .2, 1]); K(el, 'x', [t, dx], [t + d, 0, ease]); K(el, 'y', [t, dy], [t + d, 0, ease]); K(el, 'b', [t, 12], [t + .3, 0]); }
const shake = (t, a) => SHAKES.push([t, a]);
function typeText(el, txt, t0, t1) { HOOKS.push((t) => { el.textContent = txt.slice(0, Math.round(clamp01((t - t0) / (t1 - t0)) * txt.length)); }); }
function drawStroke(path, t0, d) {  // SVG stroke draw-on
  const L = path.getTotalLength(); path.style.strokeDasharray = L;
  HOOKS.push((t) => { path.style.strokeDashoffset = L * (1 - E.out(clamp01((t - t0) / d))); });
}

// headline: tokens split on spaces, '|' = line break, *...* = gradient words; ws[i] = reveal time of word i
function headline(p, txt, ws, top, size = 104, css = '') {
  const el = $('div', 'hl', p, `top:${top}px;font-size:${size}px;${css}`), words = [];
  let g = false;
  for (const tok of txt.split(' ')) {
    if (tok === '|') { $('br', null, el); continue; }
    let w = tok; if (w[0] === '*') { g = true; w = w.slice(1); }
    const end = w.endsWith('*'); if (end) w = w.slice(0, -1);
    const sp = $('span', 'w' + (g ? ' g' : ''), el); sp.textContent = w; words.push(sp);
    el.appendChild(document.createTextNode(' '));
    if (end) g = false;
  }
  words.forEach((w, i) => ws[i] != null && reveal(w, ws[i] - .06));
  HLS.push(el); return {el, words};
}
function fitAndGrade() {  // shrink lines that would overflow, then one continuous gradient per highlighted phrase
  for (const el of HLS) {
    let fs = parseFloat(el.style.fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 40) { fs -= 3; el.style.fontSize = fs + 'px'; }
    const gs = [...el.querySelectorAll('.w.g')]; if (!gs.length) continue;
    const L = Math.min(...gs.map((g) => g.offsetLeft)), R = Math.max(...gs.map((g) => g.offsetLeft + g.offsetWidth));
    for (const g of gs) { g.style.backgroundSize = `${R - L}px 100%`; g.style.backgroundPosition = `${L - g.offsetLeft}px 0`; }
  }
}

// ---------------------------------------------------------------- airy background: pastel aurora + dot grid + glow + grain
function buildBG() {
  const B = [[-330, -260, 1300, '186,214,255', .9], [470, 140, 1150, '222,208,255', .85], [-420, 1080, 1300, '255,212,230', .75], [430, 1230, 1200, '255,226,204', .8]]
    .map(([x, y, d, c, a]) => $('div', 'abs', BG, `left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;background:radial-gradient(circle,rgba(${c},${a}) 0%,rgba(${c},${a * .55}) 32%,rgba(${c},0) 68%)`));
  $('div', 'abs', BG, 'inset:0;background-image:radial-gradient(rgba(11,16,51,.085) 1.7px,transparent 2px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 80% 62% at 50% 46%,#000 25%,transparent 100%)');
  $('div', 'abs', BG, 'inset:0;background:radial-gradient(ellipse 62% 42% at 50% 44%,rgba(255,255,255,.9),rgba(255,255,255,0) 72%)');
  HOOKS.push((t) => B.forEach((b, i) => { b.style.transform = `translate(${Math.sin(t * .32 + i * 1.9) * 70}px,${Math.cos(t * .27 + i * 1.3) * 60}px) scale(${1 + .06 * Math.sin(t * .4 + i)})`; }));
  document.getElementById('grain').style.cssText += `;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04 0 0 0 0 0.06 0 0 0 0 0.2 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");opacity:.05;pointer-events:none`;
}

// ---------------------------------------------------------------- transitions
function bloom(t, a = .85) {  // white light bloom + expanding gradient ring
  const f = $('div', 'abs', FX, 'inset:0;background:radial-gradient(circle at 50% 46%,#fff 0%,rgba(255,255,255,.85) 30%,rgba(255,255,255,0) 72%)');
  K(f, 'o', [t - .02, 0], [t + .03, a, 'lin'], [t + .45, 0]);
  const r = $('div', 'abs', FX, 'left:290px;top:710px;width:500px;height:500px;border-radius:50%;padding:6px;background:' + GRAD135 + ';-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude');
  K(r, 's', [t, .2], [t + .8, 2.9]); K(r, 'o', [t - .01, 0], [t, .9, 'lin'], [t + .8, 0]);
}
function wipe(t) {  // prismatic light-band sweeping across the cut
  const band = $('div', 'abs', FX, 'left:0;top:-500px;width:300px;height:2900px;transform-origin:center');
  $('div', '', band, `width:100%;height:100%;transform:rotate(16deg);filter:blur(26px);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(37,99,235,.35) 22%,rgba(255,255,255,.95) 42%,rgba(255,255,255,.95) 52%,rgba(219,39,119,.32) 72%,rgba(249,115,22,.0))`);
  K(band, 'x', [t - .2, -700], [t + .16, 1500, 'lin']); K(band, 'o', [t - .2, 1], [t + .16, 1]);
}
function scene(t0, t1, kin) {
  const sc = $('div', 'scene', CAM), inner = $('div', 'inner', sc), first = t0 <= .001, last = t1 >= TL.total - .001;
  if (!first) {
    if (kin === 'wipe') { wipe(t0); K(sc, 'o', [t0 - .03, 0], [t0 + .08, 1, 'lin']); K(sc, 'x', [t0 - .07, 50], [t0 + .3, 0]); }
    else if (kin === 'bloom') { bloom(t0); K(sc, 'o', [t0 - .03, 0], [t0 + .1, 1]); K(sc, 's', [t0 - .03, 1.06], [t0 + .35, 1]); }
    else { K(sc, 'o', [t0 - .03, 0], [t0 + .12, 1]); K(sc, 's', [t0 - .05, .965], [t0 + .3, 1]); K(sc, 'b', [t0 - .05, 10], [t0 + .2, 0]); }
    sfx(t0, 'whoosh');
  }
  if (!last) { K(sc, 'o', [t1 - .1, 1], [t1 + .05, 0, 'io']); K(sc, 's', [t1 - .1, 1], [t1 + .05, 1.035, 'io']); K(sc, 'b', [t1 - .1, 0], [t1 + .05, 8, 'io']); }  // short crossfade: no blank frame, no readable double exposure
  K(inner, 's', [t0, 1], [t1, 1.025, 'lin']);
  return inner;
}
const exampleTag = (p, x, y) => $('div', 'tag', p, `left:${x}px;top:${y}px`, 'EXAMPLE');
function chip(p, x, y, icon, text, col = INK) {
  return $('div', 'chip', p, `left:${x}px;top:${y}px`, `<span class="disc" style="width:44px;height:44px">${ico(icon, 24, '#fff', 2.4)}</span><span style="color:${col}">${text}</span>`);
}
function nMark(p, cx, cy, h, bg = GRAD135) {  // NEQO "N" mark cut from the logo PNG, tinted via mask
  const w = h * 260 / 250;
  return $('div', 'abs', p, `left:${cx - w / 2}px;top:${cy - h / 2}px;width:${w}px;height:${h}px;background:${bg};-webkit-mask:url(${LOGO_N}) center/contain no-repeat;mask:url(${LOGO_N}) center/contain no-repeat`);
}
function halo(p, cx, cy, r, t0, d = .6, sw = 6) {
  const s = $('div', 'abs', p, `left:${cx - r - 10}px;top:${cy - r - 10}px;width:${2 * r + 20}px;height:${2 * r + 20}px`,
    `<svg width="${2 * r + 20}" height="${2 * r + 20}"><circle cx="${r + 10}" cy="${r + 10}" r="${r}" fill="none" stroke="url(#gs)" stroke-width="${sw}" stroke-linecap="round" transform="rotate(-90 ${r + 10} ${r + 10})"/></svg>`);
  drawStroke(s.querySelector('circle'), t0, d); return s;
}

// ---------------------------------------------------------------- the team (signature device)
const TEAM = [['app-window', 'Website'], ['map-pin', 'Local SEO'], ['message-circle-heart', 'Social'], ['star', 'Reviews'],
  ['chart-column-increasing', 'Reports'], ['headset', 'Strategy &amp; Support']];
const SLOT = (i) => [105 + (i % 2) * 450, 790 + Math.floor(i / 2) * 210];  // 420x180 board slots
const BAR = (i) => [298 + i * 84 + 32, 264];                               // team-bar chip centres (64px chips)

function buildTeam(S) {  // S: scene start times by id
  const hook = LN.hook.w, meet = LN.meet.w, price = LN.price.w;
  const tAsm = meet[4] - .12, tBar = S.website, tFold = price[2];
  const board = $('div', 'abs', OVER, 'inset:0'), g = S.meet - .14;  // the board glitches with the hook headline
  K(board, 'x', [g, 0], [g + .05, -22, 'lin'], [g + .1, 18, 'lin'], [g + .15, -10, 'lin'], [g + .2, 6, 'lin'], [g + .25, 0, 'lin']);
  K(board, 'sk', [g, 0], [g + .05, -6, 'lin'], [g + .1, 5, 'lin'], [g + .15, -3, 'lin'], [g + .25, 0, 'lin']);
  TEAM.forEach(([icon, name], i) => {
    const [x, y] = SLOT(i);
    // empty dashed slot with a coral "?" (the problem: nobody runs this)
    const slot = $('div', 'abs row', board, `left:${x}px;top:${y}px;width:420px;height:180px;border:3px dashed #C3CADF;border-radius:34px;background:rgba(255,255,255,.5);padding:0 30px;gap:22px`,
      `<span class="disc" style="width:80px;height:80px;background:#EEF1F8">${ico(icon, 38, '#A3ABC3', 2.2)}</span><span style="font-weight:700;font-size:${name.length > 12 ? 28 : 34}px;color:#9AA3BE;line-height:1.15">${name}</span>`);
    const q = $('div', 'abs row', board, `left:${x + 372}px;top:${y - 18}px;width:58px;height:58px;border-radius:50%;background:${CORAL};color:#fff;font-weight:900;font-size:36px;justify-content:center;box-shadow:0 10px 24px rgba(242,87,91,.35)`, '?');
    pop(q, -.5, .2, null); K(q, 's', [hook[3] + i * .04, 1], [hook[3] + .12 + i * .04, 1.3], [hook[3] + .36 + i * .04, 1, 'back']);
    K(slot, 'r', [hook[4], 0], [hook[4] + .08, i % 2 ? 2.5 : -2.5, 'lin'], [hook[4] + .16, i % 2 ? -2 : 2, 'lin'], [hook[4] + .24, i % 2 ? 1 : -1, 'lin'], [hook[4] + .32, 0, 'lin']);
    K(slot, 'o', [0, 1], [tAsm + i * .06 + .2, 1], [tAsm + i * .06 + .32, 0]); K(q, 'o', [tAsm + i * .06 + .1, 1], [tAsm + i * .06 + .2, 0]);
    // filled badge flies in on "assembled."
    const badge = $('div', 'card row', board, `left:${x}px;top:${y}px;width:420px;height:180px;border-radius:34px;padding:0 28px;gap:22px`,
      `<span class="disc" style="width:84px;height:84px;box-shadow:0 10px 26px rgba(124,58,237,.3)">${ico(icon, 40, '#fff', 2.3)}</span>
       <span><span style="display:block;font-weight:800;font-size:${name.length > 12 ? 29 : 36}px;line-height:1.12;letter-spacing:-.02em">${name}</span>
       <span class="row" style="margin-top:8px;gap:8px;font-weight:700;font-size:22px;color:${MINT}">${ico('circle-check', 22, MINT, 2.6)}ON IT</span></span>`);
    const t = tAsm + i * .06, dx = (i % 2 ? 1 : -1) * 760;
    K(badge, 'o', [t, 0], [t + .08, 1]); K(badge, 'x', [t, dx], [t + .42, 0, 'back']); K(badge, 'y', [t, 120 - Math.floor(i / 2) * 60], [t + .42, 0, 'back']);
    K(badge, 'r', [t, (i % 2 ? 9 : -9)], [t + .42, 0, 'back']); K(badge, 'b', [t, 14], [t + .25, 0]);
    sfx(t + .3, 'pop', i);
    // badge folds into its team-bar chip at the cut to the first feature scene
    const [cx, cy] = BAR(i), bx = x + 210, by = y + 90;
    K(badge, 'x', [tBar - .24, 0], [tBar + .14, cx - bx, 'io']); K(badge, 'y', [tBar - .24, 0], [tBar + .14, cy - by, 'io']);
    K(badge, 's', [tBar - .24, 1], [tBar + .14, .16, 'io']); K(badge, 'o', [tBar + .06, 1], [tBar + .16, 0]);
  });
  // persistent team bar: one chip per function; the active one glows, finished ones get a check
  const order = ['website', 'seo', 'social', 'reviews', 'report', 'strategy'];
  TEAM.forEach(([icon], i) => {
    const [cx, cy] = BAR(i), id = order[i];
    const base = $('div', 'abs row', OVER, `left:${cx - 32}px;top:${cy - 32}px;width:64px;height:64px;border-radius:50%;background:#fff;border:1.5px solid #E3E7F2;justify-content:center;box-shadow:0 10px 26px rgba(37,64,180,.14)`, ico(icon, 30, SLATE, 2.2));
    pop(base, tBar + .08 + i * .03, .3, null);
    const act = $('div', 'abs row disc', OVER, `left:${cx - 32}px;top:${cy - 32}px;width:64px;height:64px;box-shadow:0 12px 30px rgba(124,58,237,.45)`, ico(icon, 30, '#fff', 2.4));
    const a0 = S[id], a1 = S[order[i + 1]] || S.price;
    K(act, 'o', [a0, 0], [a0 + .15, 1], [a1 - .05, 1], [a1 + .1, 0]); K(act, 's', [a0, .6], [a0 + .4, 1.18, 'back'], [a1 - .05, 1.18], [a1 + .1, 1]);
    const done = $('div', 'abs row', OVER, `left:${cx + 12}px;top:${cy - 40}px;width:30px;height:30px;border-radius:50%;background:${MINT};justify-content:center;border:2.5px solid #fff`, ico('check', 16, '#fff', 3.2));
    pop(done, a1 - .02, .2, null);
    // the whole team folds into the Ultra card on "team"
    for (const el of [base, done]) { K(el, 's', [tFold + i * .02, 1], [tFold + .26 + i * .02, .3, 'inn']); K(el, 'o', [tFold + .1 + i * .02, 1], [tFold + .26 + i * .02, 0]); }
  });
}

// ---------------------------------------------------------------- scenes (one per VO line)
const S = {};
const B = {};
B.hook = (p, l, t0, t1) => {
  headline(p, 'Want your own | *marketing team?*', [-.24, ...l.w.slice(1)], 330, 112);  // 'Want' visible from frame 0 (cover frame)
  const g = t1 - .14;  // glitch into the drop
  K(p, 'x', [g, 0], [g + .05, 26, 'lin'], [g + .1, -20, 'lin'], [g + .15, 12, 'lin'], [g + .2, -6, 'lin'], [g + .25, 0, 'lin']);
  K(p, 'sk', [g, 0], [g + .05, 8, 'lin'], [g + .1, -6, 'lin'], [g + .15, 4, 'lin'], [g + .25, 0, 'lin']);
  sfx(g, 'glitch');
};
B.meet = (p, l, t0) => {
