<!doctype html>
<html><head><meta charset="utf-8"><title>NEQO Local SEO reel</title>
<!-- Motion graphics for the NEQO Digital "Local SEO - rank #1 on Google" reel. Driven by build/timeline.js (VO-synced word times);
     render.cjs calls window.build() once, then window.seek(t) per frame. -->
<style>
@font-face{font-family:I;src:url(build/fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:I;src:url(build/fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:I;src:url(build/fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:I;src:url(build/fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:I;src:url(build/fonts/Inter-900.ttf);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#04050b;font-family:I,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#bg,#cam,#fx,.scene,.inner{position:absolute;inset:0}
.abs{position:absolute}
.glow{position:absolute;border-radius:50%}
.dot{position:absolute;left:0;top:0;border-radius:50%;background:#fff}
.hl{position:absolute;left:80px;right:80px;white-space:nowrap;text-align:center;font-weight:800;font-size:96px;line-height:1.1;letter-spacing:-.035em}
.w{display:inline-block;padding:.04em .02em .12em;margin:0 -.02em;background:linear-gradient(180deg,#fff 40%,#b4b9c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.w.g{background-image:linear-gradient(90deg,#3d8bff 0%,#8b5cf6 38%,#ec4899 70%,#ff7a3d 100%)}
.card{position:absolute;background:linear-gradient(180deg,rgba(30,31,40,.96),rgba(18,19,25,.96));border:2px solid rgba(255,255,255,.08);border-radius:40px;box-shadow:0 60px 140px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.05)}
.row{display:flex;align-items:center}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:10px 22px;font-weight:700}
</style></head>
<body><div id="bg"></div><div id="cam"></div><div id="fx"></div>
<script src="../neqo999/assets/icons.js"></script>
<script src="build/timeline.js"></script>
<script>
const TL = window.TL, BG = document.getElementById('bg'), CAM = document.getElementById('cam'), FX = document.getElementById('fx');
const GRAD = 'linear-gradient(90deg,#3d8bff 0%,#8b5cf6 38%,#ec4899 70%,#ff7a3d 100%)';
const gtxt = s => `<span style="background:${GRAD};-webkit-background-clip:text;background-clip:text;color:transparent">${s}</span>`;

// ---------------------------------------------------------------- tiny deterministic animation engine
const E = {lin: x => x, out: x => 1 - (1 - x) ** 3, inn: x => x ** 3, io: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  back: x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2};
const ELS = new Map(), HOOKS = [], SFX = [], SHAKES = [], HLS = [];
const DEF = {x: 0, y: 0, s: 1, sx: 1, r: 0, o: 1, b: 0, sk: 0};
function K(el, prop, ...keys) {  // keys: [time, value, easing-into-this-key]
  let s = ELS.get(el); if (!s) ELS.set(el, s = {});
  (s[prop] = s[prop] || []).push(...keys); s[prop].sort((a, b) => a[0] - b[0]);
}
function val(k, t) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t < k[i][0]) {
    const [a, va] = k[i - 1], [b, vb, e] = k[i]; return va + (vb - va) * E[e || 'out']((t - a) / (b - a));
  }
  return k[k.length - 1][1];
}
function seek(t) {
  for (const [el, s] of ELS) {
    const v = {...DEF}; for (const p in s) v[p] = val(s[p], t);
    el.style.opacity = v.o; el.style.visibility = v.o < .002 ? 'hidden' : 'visible';
    el.style.transform = `translate(${v.x}px,${v.y}px) rotate(${v.r}deg) skewX(${v.sk}deg) scale(${v.s * v.sx},${v.s})`;
    el.style.filter = v.b > .05 ? `blur(${v.b.toFixed(2)}px)` : 'none';
  }
  let dx = 0, dy = 0;
  for (const [t0, a] of SHAKES) if (t >= t0) { const q = t - t0, d = a * Math.exp(-q * 9); dx += d * Math.sin(q * 71); dy += d * Math.cos(q * 53); }
  CAM.style.transform = `translate(${dx}px,${dy}px)`;
  for (const h of HOOKS) h(t);
}
function $(tag, cls, parent, css, html) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html;
  parent.appendChild(e); return e;
}
const sfx = (t, type, p = 0) => SFX.push([+t.toFixed(3), type, p]);
const clamp01 = x => Math.max(0, Math.min(1, x));
function reveal(el, t, d = .32, dy = 34) { K(el, 'o', [t, 0], [t + d * .6, 1]); K(el, 'b', [t, 14], [t + d, 0]); K(el, 'y', [t, dy], [t + d, 0]); }
function pop(el, t, from = .5, snd = 0) {
  K(el, 'o', [t, 0], [t + .1, 1]); K(el, 's', [t, from], [t + .42, 1, 'back']); K(el, 'b', [t, 8], [t + .2, 0]);
  if (snd !== null) sfx(t, 'pop', snd);
}
function slide(el, t, dx, dy, d = .5) { K(el, 'o', [t, 0], [t + .2, 1]); K(el, 'x', [t, dx], [t + d, 0]); K(el, 'y', [t, dy], [t + d, 0]); K(el, 'b', [t, 12], [t + .3, 0]); }
function flash(t, a = .6) {
  const f = $('div', 'abs', FX, 'inset:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(190,200,255,.55) 35%,transparent 75%)');
  K(f, 'o', [t, 0], [t + .03, a, 'lin'], [t + .4, 0]);
}
const shake = (t, a) => SHAKES.push([t, a]);
function typeText(el, txt, t0, t1) { HOOKS.push(t => { el.textContent = txt.slice(0, Math.round(clamp01((t - t0) / (t1 - t0)) * txt.length)); }); }
function count(el, a, b, t0, t1) { HOOKS.push(t => { el.textContent = Math.round(a + (b - a) * E.out(clamp01((t - t0) / (t1 - t0)))).toLocaleString('en-US'); }); }

// headline: tokens split on spaces, '|' = line break, *...* = gradient words; ws[i] = reveal time of word i
function headline(p, txt, ws, top, size = 96, css = '') {
  const el = $('div', 'hl', p, `top:${top}px;font-size:${size}px;${css}`), words = [];
  let g = false;
  for (const tok of txt.split(' ')) {
    if (tok === '|') { $('br', null, el); continue; }
    let w = tok; if (w[0] === '*') { g = true; w = w.slice(1); }
    const end = w.endsWith('*'); if (end) w = w.slice(0, -1);
    const sp = $('span', 'w' + (g ? ' g' : ''), el); sp.textContent = w; words.push(sp);
    el.appendChild(document.createTextNode(' '));
    if (end) g = false;
  }
  words.forEach((w, i) => ws[i] != null && reveal(w, ws[i] - .06));
  HLS.push(el); return {el, words};
}
function fixGradients() {  // one continuous gradient across each highlighted phrase
  for (const el of HLS) {
    const gs = [...el.querySelectorAll('.w.g')]; if (!gs.length) continue;
    const L = Math.min(...gs.map(g => g.offsetLeft)), R = Math.max(...gs.map(g => g.offsetLeft + g.offsetWidth));
    for (const g of gs) { g.style.backgroundSize = `${R - L}px 100%`; g.style.backgroundPosition = `${L - g.offsetLeft}px 0`; }
  }
}

// ---------------------------------------------------------------- background: nebula glows + drifting particles
function buildBG() {
  const G = [[-420, -300, 1500, 'rgba(37,99,235,.42)'], [380, 900, 1500, 'rgba(126,34,206,.36)'],
             [-500, 1250, 1300, 'rgba(219,39,119,.2)'], [500, -500, 1100, 'rgba(14,165,233,.16)']]
    .map(([x, y, d, c]) => $('div', 'glow', BG, `left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:radial-gradient(circle,${c} 0%,transparent 65%)`));
  let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const P = [];
  for (let i = 0; i < 90; i++) {
    const big = i < 14, sz = big ? 30 + rnd() * 70 : 2 + rnd() * 4;
    const d = $('div', 'dot', BG, `width:${sz}px;height:${sz}px;` + (big
      ? `background:radial-gradient(circle,rgba(${rnd() < .5 ? '140,120,255' : '255,90,160'},.16),transparent 70%)`
      : `opacity:${.2 + rnd() * .6};box-shadow:0 0 ${sz * 2}px rgba(160,170,255,.8)`));
    P.push({d, x: rnd() * 1080, y: rnd() * 1920, vx: (rnd() - .5) * 14, vy: -6 - rnd() * 22});
  }
  $('div', 'abs', BG, 'inset:0;background:radial-gradient(ellipse 80% 65% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)');
  HOOKS.push(t => {
    G.forEach((g, i) => g.style.transform = `translate(${Math.sin(t * .25 + i * 1.7) * 90}px,${Math.cos(t * .2 + i) * 70}px) scale(${1 + .08 * Math.sin(t * .3 + i)})`);
    for (const p of P) p.d.style.transform = `translate(${((p.x + p.vx * t) % 1080 + 1080) % 1080}px,${((p.y + p.vy * t) % 1920 + 1920) % 1920}px)`;
  });
}

// ---------------------------------------------------------------- helpers for this reel
function fitAndGrade() {  // shrink lines that would overflow, then one continuous gradient per highlighted phrase
  for (const el of HLS) {
    let fs = parseFloat(el.style.fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && fs > 40) { fs -= 3; el.style.fontSize = fs + 'px'; }
    const gs = [...el.querySelectorAll('.w.g')]; if (!gs.length) continue;
    const L = Math.min(...gs.map(g => g.offsetLeft)), R = Math.max(...gs.map(g => g.offsetLeft + g.offsetWidth));
    for (const g of gs) { g.style.backgroundSize = `${R - L}px 100%`; g.style.backgroundPosition = `${L - g.offsetLeft}px 0`; }
  }
}
function scene(t0, t1) {
  const sc = $('div', 'scene', CAM), inner = $('div', 'inner', sc), first = t0 <= .001, last = t1 >= TL.total - .001;
  K(sc, 'o', [t0 - (first ? 0 : .04), first ? 1 : 0], [t0 + .16, 1]);
  if (!first) { K(sc, 's', [t0 - .04, 1.07], [t0 + .26, 1]); K(sc, 'b', [t0 - .04, 16], [t0 + .2, 0]); sfx(t0, 'whoosh'); }
  if (!last) { K(sc, 'o', [t1 - .12, 1], [t1 + .06, 0, 'inn']); K(sc, 's', [t1 - .12, 1], [t1 + .06, .93, 'inn']); K(sc, 'b', [t1 - .12, 0], [t1 + .06, 14, 'inn']); }
  K(inner, 's', [t0, 1], [t1, 1.03, 'lin']);
  return inner;
}
function logo(p, y0, sc) {  // NEQO DIGITAL lockup cut from the first reel's end card (840x750 source canvas)
  return [['logo_n', 260, 292, 35], ['logo_neqo', 750, 45, 395], ['logo_digital', 540, 150, 632]].map(([f, w, x, y]) => {
    const im = $('img', 'abs', p, `left:${540 + (x - 420) * sc}px;top:${y0 + y * sc}px;width:${w * sc}px`); im.src = `../reel/assets/${f}.png`; return im;
  });
}
const ico = (n, s = 32, c = '#fff', sw = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${ICONS[n]}</svg>`;
const STARS = '<span style="color:#fbbf24;letter-spacing:2px">★★★★★</span>';
const skel = (w, h = 24, a = .16) => `<div style="width:${w}px;height:${h}px;border-radius:${h / 2}px;background:rgba(255,255,255,${a})"></div>`;
const tag = (p, css) => $('div', 'abs', p, css + ';font-weight:800;font-size:19px;letter-spacing:.16em;color:rgba(255,255,255,.62);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);padding:6px 13px;border-radius:999px', 'EXAMPLE');
const note = (p, txt = 'Illustrative example.') => $('div', 'abs', p, 'left:60px;right:60px;top:1478px;text-align:center;font-weight:500;font-size:24px;line-height:1.45;color:rgba(255,255,255,.42)', txt);
const COLORS = ['#3b82f6', '#8b5cf6', '#06b6d4', '#f97316'];
function compRow(par, top, color, sw, r) {  // anonymous competitor result (no made-up business names)
  return $('div', 'abs row', par, `left:0;right:0;top:${top}px;height:112px;padding:0 24px;gap:24px;border-radius:26px`,
    `<div style="width:72px;height:72px;border-radius:20px;background:${color};opacity:.8;flex:none"></div>
     <div style="flex:1">${skel(sw, 26)}<div style="margin-top:14px;font-weight:500;font-size:24px;color:#9aa0b2">${STARS} ${r}</div></div>`);
}
function usRow(par, top, sub, css = '') {
  return $('div', 'abs row', par, `left:0;right:0;top:${top}px;height:112px;padding:0 24px;gap:24px;border-radius:26px;${css}`,
    `<div style="width:72px;height:72px;border-radius:20px;background:${GRAD};flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px">Y</div>
     <div style="flex:1"><div style="font-weight:700;font-size:36px">Your Business</div><div class="sub" style="font-weight:500;font-size:24px;color:#9aa0b2;margin-top:6px">${sub}</div></div>`);
}
function searchCard(p, top, h) {
  const c = $('div', 'card', p, `left:70px;top:${top}px;width:940px;height:${h}px;overflow:hidden`);
  $('div', 'row', c, 'height:74px;padding:0 30px;gap:12px;border-bottom:2px solid rgba(255,255,255,.06)',
    '<span style="width:18px;height:18px;border-radius:50%;background:#ff5f57"></span><span style="width:18px;height:18px;border-radius:50%;background:#febc2e"></span><span style="width:18px;height:18px;border-radius:50%;background:#28c840"></span>');
  const sb = $('div', 'row', c, 'margin:26px 30px;height:92px;border-radius:46px;background:#0d0e13;border:2px solid rgba(255,255,255,.1);padding:0 34px;gap:20px;font-weight:600;font-size:38px',
    `${ico('search', 34, '#9aa0b2', 2.6)}<span class="q"></span><span style="width:3px;height:44px;background:#60a5fa;margin-left:-14px"></span>`);
  tag(c, 'right:30px;top:20px');
  return {c, q: sb.querySelector('.q')};
}
function ripples(par, t0, t1, col, n = 2, period = .9) {  // expanding rings around a ringing phone / map pin
  const R = Array.from({length: n}, () => $('div', 'abs', par, `inset:0;border-radius:50%;border:4px solid ${col};pointer-events:none`));
  HOOKS.push(t => R.forEach((r, i) => {
    const q = ((t - t0) / period + i / n) % 1, on = t >= t0 && t <= t1;
    r.style.transform = `scale(${1 + q * .9})`; r.style.opacity = on ? (1 - q) * .8 : 0;
  }));
}
function glitchOut(p, g) {
  K(p, 'x', [g, 0], [g + .05, -28, 'lin'], [g + .1, 22, 'lin'], [g + .15, -14, 'lin'], [g + .2, 10, 'lin'], [g + .25, 0, 'lin']);
  K(p, 'sk', [g, 0], [g + .05, 9, 'lin'], [g + .1, -7, 'lin'], [g + .15, 5, 'lin'], [g + .25, 0, 'lin']);
  sfx(g, 'glitch');
}

// ---------------------------------------------------------------- scenes (one per VO line)
const S = {};
S.hook = (p, l, t0) => {
  const w = l.w;
  K($('div', 'abs', p, 'left:90px;top:330px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.3),transparent 62%)'), 'o', [0, .55], [w[3], 1]);
  const h = headline(p, 'Want to rank | *#1 on Google?*', [-.24, w[1], w[2], w[3], w[5], w[6]], 560, 132);
  K(h.words[3], 's', [w[3] - .06, 1.6], [w[3] + .4, 1, 'back']); sfx(w[3], 'pop', 6);
  const sb = $('div', 'abs row', p, 'left:110px;top:1000px;width:860px;height:112px;border-radius:56px;background:rgba(13,14,19,.92);border:2px solid rgba(255,255,255,.12);padding:0 40px;gap:22px;font-weight:600;font-size:42px;box-shadow:0 30px 90px rgba(0,0,0,.6)',
    `${ico('search', 38, '#9aa0b2', 2.6)}<span class="q"></span><span class="cur" style="width:3px;height:48px;background:#60a5fa;margin-left:-16px"></span>`);
  typeText(sb.querySelector('.q'), 'plumber near me', .3, 1.25);
  const cur = sb.querySelector('.cur'); HOOKS.push(t => { cur.style.opacity = t > .3 && t < 1.3 ? 1 : (Math.floor(t * 2.4) % 2 ? .15 : 1); });
  const dd = $('div', 'abs', p, 'left:150px;top:1136px;width:780px;padding:16px 0;border-radius:30px;background:rgba(20,21,28,.92);border:2px solid rgba(255,255,255,.08)');
  [[340, '#3b82f6'], [280, '#8b5cf6'], [310, '#06b6d4']].forEach(([sw, c], i) => {
    const r = $('div', 'row', dd, 'height:78px;padding:0 34px;gap:22px', `${ico('map-pin', 30, c, 2.4)}${skel(sw, 22, .14)}`);
    reveal(r, w[5] + i * .06, .25, 14);
  });
  reveal(dd, w[5] - .08, .25, 20);
};

S.search = (p, l, t0) => {
  const w = l.w;
  note(p);
  headline(p, 'Your customers | are *searching.*', w, 250, 104);
  const {c, q} = searchCard(p, 540, 880);
  slide(c, t0 + .02, 0, 120, .5);
  typeText(q, 'plumber near me', t0 + .1, t0 + .6);
  const list = $('div', 'abs', c, 'left:30px;right:30px;top:226px;bottom:20px');
  [[330, '4.9'], [260, '4.8'], [300, '4.8']].forEach(([sw, r], i) => reveal(compRow(list, i * 126, COLORS[i], sw, r), t0 + .3 + i * .08, .25, 20));
  const dv = $('div', 'abs row', list, 'left:0;right:0;top:388px;height:60px;gap:22px;font-weight:700;font-size:22px;letter-spacing:.24em;color:rgba(255,255,255,.34)',
    '<span style="flex:1;height:2px;background:rgba(255,255,255,.08)"></span>PAGE 4<span style="flex:1;height:2px;background:rgba(255,255,255,.08)"></span>');
  reveal(dv, w[2] - .05, .3, 10);
  const us = usRow(list, 466, 'No reviews yet · Hours unknown', 'border:3px solid rgba(239,68,68,.75);background:rgba(239,68,68,.08);box-shadow:0 0 50px rgba(239,68,68,.22)');
  $('div', 'pill', us, 'background:rgba(239,68,68,.16);color:#ff7b7b;font-size:26px;padding:10px 20px', 'Page 4');
  reveal(us, w[3] - .06, .3, 24); sfx(w[3], 'tick', 3);
};

S.buried = (p, l, t0, t1) => {
  const w = l.w;
  note(p);
  headline(p, 'Not on top? | They call *someone else.*', w, 250, 100);
  const call = $('div', 'card', p, 'left:110px;top:560px;width:860px;padding:44px 48px 48px');
  call.innerHTML = `<div class="row" style="gap:18px;font-weight:700;font-size:30px;color:#4ade80"><span style="width:16px;height:16px;border-radius:50%;background:#4ade80;box-shadow:0 0 14px #4ade80"></span>Calling the top result…</div>
    <div class="row" style="margin-top:40px;gap:36px"><div class="ph" style="position:relative;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#15803d);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 60px rgba(34,197,94,.5)"><div class="ic">${ico('phone', 68, '#fff', 2.2)}</div></div>
    <div style="flex:1">${skel(380, 34, .22)}<div style="margin-top:18px">${skel(250, 24, .12)}</div><div style="margin-top:22px;font-weight:600;font-size:28px;color:#9aa0b2">${STARS} #1 on the map</div></div></div>`;
  tag(call, 'right:30px;top:30px');
  slide(call, t0 + .02, 0, 120, .5);
  const ph = call.querySelector('.ph'), ic = call.querySelector('.ic'), tr = w[3] - .05;
  ripples(ph, tr, t1, 'rgba(74,222,128,.75)');
  HOOKS.push(t => { ic.style.transform = t > tr && t < t1 ? `rotate(${Math.sin(t * 46) * 12}deg)` : 'none'; });
  sfx(w[4], 'tick', 1); sfx(w[4] + .2, 'tick', 1);
  const you = $('div', 'card', p, 'left:110px;top:1080px;width:860px;height:150px');
  usRow(you, 19, 'Page 4 · <span style="color:#ff7b7b">phone silent</span>', 'left:20px;right:20px');
  reveal(you, w[5] - .05, .3, 30); K(you, 'o', [w[6] + .15, 1], [w[6] + .45, .5]);
  glitchOut(p, t1 - .3);
};

S.meet = (p, l, t0) => {
  const burst = $('div', 'abs', p, 'left:-460px;top:-60px;width:2000px;height:2000px;border-radius:50%;background:radial-gradient(circle,rgba(170,190,255,.6) 0%,rgba(120,90,255,.28) 22%,transparent 58%)');
  K(burst, 's', [t0, .1], [t0 + .8, 1.25]); K(burst, 'o', [t0, 1], [t0 + 1, 0]);
  const ring = $('div', 'abs', p, 'left:240px;top:640px;width:600px;height:600px;border-radius:50%;border:5px solid rgba(170,185,255,.8);box-shadow:0 0 60px rgba(140,120,255,.9),inset 0 0 60px rgba(140,120,255,.6)');
  K(ring, 's', [t0, .15], [t0 + .9, 2.8]); K(ring, 'o', [t0, 1], [t0 + .9, 0]);
  K($('div', 'abs', p, 'left:90px;top:390px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(80,100,255,.32),transparent 62%)'), 'o', [t0, 0], [t0 + .5, 1]);

  await Promise.all([500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 60px I`)));

  L.forEach((l, i) => { const t1 = i + 1 < L.length ? st[i + 1] : TL.total; S[l.id](scene(st[i], t1), l, st[i], t1); });
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => im.onload = im.onerror = r)));

  return SFX.sort((a, b) => a[0] - b[0]);
};
