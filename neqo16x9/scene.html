<!doctype html>
<html><head><meta charset="utf-8"><title>NEQO Digital 16:9 ad</title>
<!-- "Full Stop": NEQO Digital 16:9 brand ad. Driven by build/timeline.js (VO-synced word times).
     render.cjs calls window.build() once, then window.seek(t) per frame. One orange ball survives every cut as punctuation. -->
<style>
@font-face{font-family:'Archivo';font-style:italic;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/Archivo-italic.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/Archivo-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 800;src:url(fonts/JetBrainsMono-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0E0E0D;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.abs{position:absolute}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.tx{position:absolute;top:0;white-space:nowrap}
.w{display:inline-block}
.bl{display:inline-block;width:0;height:0;vertical-align:baseline}
.pd{color:transparent}
.mono{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:.08em}
#fx,#hud{position:absolute;inset:0;pointer-events:none}
#ball{position:absolute;left:0;top:0;border-radius:50%;transform-origin:50% 100%;will-change:transform}
</style></head>
<body><div id="stage"></div><div id="fx"><div id="ball"></div></div><div id="hud"></div>
<svg width="0" height="0" style="position:absolute"><filter id="vb" x="-2%" y="-60%" width="104%" height="220%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter></svg>
<script src="build/timeline.js"></script>
<script src="icons.js"></script>
<script src="logo.js"></script>
<script>
const TL = window.TL, STAGE = document.getElementById('stage'), HUD = document.getElementById('hud'), FX = document.getElementById('fx'), BALL_EL = document.getElementById('ball');
const OB = '#0E0E0D', OW = '#F2F1EE', OR = '#FF5A1F', FW = 1920;

// ---------------------------------------------------------------- deterministic keyframe engine
function bez(x1, y1, x2, y2) {  // CSS cubic-bezier as an easing function
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
    for (let i = 0; i < 8; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x, d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(cx) < 1e-6 || !d) break; t -= cx / d; }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const E = {lin: x => x, out: x => 1 - (1 - x) ** 3, inn: x => x ** 3, io: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  expo: x => x >= 1 ? 1 : 1 - 2 ** (-10 * x), back: x => 1 + 2.4 * (x - 1) ** 3 + 1.4 * (x - 1) ** 2,
  smooth: bez(.32, .72, 0, 1), brake: bez(.2, .9, .1, 1), spring: x => x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(10.5 * x)};
const ELS = new Map(), HOOKS = [], SFX = [], LATE = [];
const DEF = {x: 0, y: 0, s: 1, sx: 1, sy: 1, r: 0, o: 1, b: 0, ct: 0};
function K(el, prop, ...keys) { let s = ELS.get(el); if (!s) ELS.set(el, s = {}); (s[prop] = s[prop] || []).push(...keys); s[prop].sort((a, b) => a[0] - b[0]); }
function val(k, t) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t < k[i][0]) { const [a, va] = k[i - 1], [b, vb, e] = k[i]; return va + (vb - va) * E[e || 'smooth']((t - a) / (b - a)); }
  return k[k.length - 1][1];
}
function seek(t) {
  for (const [el, s] of ELS) {
    const v = {...DEF}; for (const p in s) v[p] = val(s[p], t);
    el.style.opacity = v.o;
    el.style.transform = `translate(${v.x}px,${v.y}px) rotate(${v.r}deg) scale(${v.s * v.sx},${v.s * v.sy})`;
    el.style.filter = v.b > .05 ? `blur(${v.b.toFixed(2)}px)` : 'none';
    el.style.clipPath = v.ct > .01 ? `inset(${v.ct}% -30% -40% -30%)` : 'none';
    if (s.wg || s.wd) el.style.fontVariationSettings = `"wght" ${(s.wg ? v.wg : el._wg).toFixed(1)},"wdth" ${(s.wd ? v.wd : el._wd).toFixed(1)}`;
  }
  for (const h of HOOKS) h(t);
  for (const h of LATE) h(t);  // ball + HUD read the settled layout
}
function $(tag, cls, parent, css, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
const sfx = (t, type, p = 0) => SFX.push([+t.toFixed(3), type, p]);
const clamp01 = x => Math.max(0, Math.min(1, x)), lerp = (a, b, q) => a + (b - a) * q;
function rng(seed) { return () => (seed = seed * 16807 % 2147483647) / 2147483647; }
function typeText(el, txt, t0, t1) { HOOKS.push(t => { el.textContent = txt.slice(0, Math.round(clamp01((t - t0) / (t1 - t0)) * txt.length)); }); }

// ---------------------------------------------------------------- type helpers
// T(): a text block positioned by its first baseline (x, y). Words wrapped in .w; P() is an invisible period the ball replaces.
const BLS = [];
function T(p, html, o) {
  const {x, y, size, w = 900, d = 100, it = false, col = OB, align = 'left', ls = '-0.035em', lh = .9, css = ''} = o;
  const el = $('div', 'tx', p, `${align === 'right' ? `right:${FW - x}px;text-align:right` : `left:${x}px`};font-size:${size}px;font-style:${it ? 'italic' : 'normal'};font-variation-settings:"wght" ${w},"wdth" ${d};letter-spacing:${ls};line-height:${lh};color:${col};${css}`, `<i class="bl"></i>${html}`);
  el._wg = w; el._wd = d; BLS.push([el, y]); return el;
}
const P = (w = 900, it = false) => `<span class="pd" data-w="${w}" data-i="${it ? 1 : 0}"><i class="bl"></i>.</span>`;
const W = s => s.split(' ').map(x => `<span class="w">${x}</span>`).join(' ');
const words = el => [...el.querySelectorAll('.w')];
function hardIn(el, t, dy = 24) { K(el, 'o', [t - .001, 0], [t, 1, 'lin']); K(el, 'y', [t, dy], [t + .22, 0, 'expo']); K(el, 'ct', [t, 40], [t + .08, 0, 'out']); }
function cutIn(el, t) { K(el, 'o', [t - .001, 0], [t, 1, 'lin']); }
const CAN = document.createElement('canvas').getContext('2d');
function anchor(pd) {  // live: centre and diameter of the period's ink, in frame pixels
  if (!pd._ink) {
    const size = parseFloat(getComputedStyle(pd).fontSize);
    CAN.font = `${pd.dataset.i === '1' ? 'italic ' : ''}${pd.dataset.w} ${size}px Archivo`;
    const m = CAN.measureText('.');
    pd._ink = {cx: (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2, cy: -(m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2, d: m.actualBoundingBoxRight + m.actualBoundingBoxLeft, w0: pd.offsetWidth};
  }
  const r = pd.getBoundingClientRect(), b = pd.firstChild.getBoundingClientRect(), k = pd._ink.w0 ? r.width / pd._ink.w0 : 1;
  return {x: r.left + pd._ink.cx * k, y: b.top + pd._ink.cy * k, d: pd._ink.d * k};
}
const pdA = el => () => anchor(el.querySelector('.pd'));

// ---------------------------------------------------------------- scenes + fields (hard cuts)
const FIELDS = [];
function scene(t0, t1, bg) {
  const sc = $('div', 'scene', STAGE, `background:${bg}`);
  FIELDS.push([t0, t1, bg]);
  HOOKS.push(t => { sc.style.visibility = t >= t0 && t < t1 ? 'visible' : 'hidden'; });
  return sc;
}
const fieldAt = t => (FIELDS.find(f => t >= f[0] && t < f[1]) || FIELDS[FIELDS.length - 1])[2];
const inkOn = bg => bg === OB ? OW : OB;

// ---------------------------------------------------------------- the ball: one orange dot, punctuation that survives every cut
const G = 6200;  // px/s^2
const BALL = [];
function seg(a, b, f) { BALL.push([a, b, f]); }
const hopDur = h => 2 * Math.sqrt(2 * h / G);
function fitHops(tl, hops, tEnd) { const out = []; let t = tl; for (const h of hops) { if (t + hopDur(h) > tEnd - .24) break; out.push(h); t += hopDur(h); } return out; }
function squash(t, ti) { const k = clamp01(1 - (t - ti) / .09) ** 2; return {sx: 1 + .38 * k, sy: 1 - .34 * k}; }
// gravity arc from P0 (object or lazily-measured fn) at t0, landing on the live anchor A at tl, then decaying hops.
// x eases out by default, so the dot arrives over its period and drops onto it instead of flying through the word.
function flight(t0, tl, P0f, A, hops = [], opt = {}) {
  let P0c = typeof P0f === 'function' ? null : P0f;
  const imp = [tl], hp = [];
  { let tt = tl; for (const h of hops) { const v = Math.sqrt(2 * G * h), du = 2 * v / G; hp.push([tt, v, du]); tt += du; imp.push(tt); } }
  const ex = E[opt.ease || 'out'];
  return t => {
    const a = A(t), P0 = P0c || (P0c = P0f());
    if (t < tl) {
      const T0 = tl - t0, q = clamp01((t - t0) / T0), tau = t - t0, vy = (a.y - P0.y) / T0 - .5 * G * T0;
      return {x: lerp(P0.x, a.x, ex(q)), y: P0.y + vy * tau + .5 * G * tau * tau, d: lerp(P0.d, a.d, E.out(q))};
    }
    let y = a.y, sq = {sx: 1, sy: 1};
    for (const [ts, v, du] of hp) if (t >= ts && t < ts + du) { const tau = t - ts; y = a.y - (v * tau - .5 * G * tau * tau); }
    for (const ti of imp) if (t >= ti && t < ti + .09) sq = squash(t, ti);
    return {x: a.x, y, d: a.d, ...sq};
  };
}
// fly from the previous beat's anchor (at the cut) onto this beat's period; hops are trimmed so the dot rests before the next cut
function chain(t0, tl, fromA, A, hops, tEnd, opt) { return flight(t0 + .02, tl, fromA, A, fitHops(tl, hops, tEnd), opt); }
const ballState = t => { let s = null; for (const [a, b, f] of BALL) if (t >= a && t < b) s = f(t); return s; };
LATE.push(t => {
  const s = ballState(t);
  if (!s || s.o === 0) { BALL_EL.style.opacity = 0; return; }
  const w = s.w || s.d, h = s.h || s.d;
  BALL_EL.style.opacity = s.o == null ? 1 : s.o;
  BALL_EL.style.width = w + 'px'; BALL_EL.style.height = h + 'px';
  BALL_EL.style.borderRadius = (s.h ? h / 2 : w / 2) + 'px';
  BALL_EL.style.background = s.col || (fieldAt(t) === OR ? OW : OR);  // on orange the dot turns off-white so it never reads as plain type
  BALL_EL.style.transform = `translate(${s.x - w / 2}px,${s.y - h / 2}px) scale(${s.sx || 1},${s.sy || 1})`;
});

// ---------------------------------------------------------------- HUD: one quiet brand label, off during the hook's first beat and on the end card
let DROP = 0;
function buildHUD() {
  const lab = $('div', 'abs mono', HUD, 'left:64px;top:46px;font-size:20px;letter-spacing:.18em', 'NEQO DIGITAL');
  const off = cut('end');
  LATE.push(t => { lab.style.color = inkOn(fieldAt(t)); lab.style.opacity = t >= .62 && t < off ? .62 : 0; });
}

// ---------------------------------------------------------------- beats
const L = Object.fromEntries(TL.lines.map(l => [l.id, l]));
const ORDER = TL.lines.map(l => l.id);
const cut = id => L[id].t0 - .04;  // the first word lands on the cut frame
const end = id => { const i = ORDER.indexOf(id); return i + 1 < ORDER.length ? cut(ORDER[i + 1]) : TL.total + 1; };
const S = {};

S.stopped = () => {
  const t1 = end('stopped'), TLk = .62, SPc = 360, V0 = 2600, A0 = V0 * TLk / 2;
  const sc = scene(0, t1, OW);
  T(sc, 'You', {x: 128, y: 290, size: 150, w: 300, it: true, col: OB});
  const rib = $('div', 'abs', sc, 'inset:0;clip-path:inset(332px 0 0 0)'), ribIn = $('div', 'abs', rib, 'inset:0'), copies = [];
  for (let k = -6; k <= 3; k++) {
    const el = T(ribIn, k === 0 ? `stopped${P(900)}` : 'stopped', {x: 120, y: 820 + k * SPc, size: 330, w: 300, d: 125, col: OB});
    el._k = k; copies.push(el);
  }
  const vbg = document.getElementById('vbg');
  HOOKS.push(t => {
    const u = clamp01(t / TLk), off = A0 * (1 - u) ** 2, v = V0 * (1 - u), q = E.brake(clamp01((t - (TLk - .3)) / .3));
    ribIn.style.transform = `translateY(${off}px)`;
    const bl = v * .0042; vbg.setAttribute('stdDeviation', `0 ${bl.toFixed(2)}`); ribIn.style.filter = bl > .3 ? 'url(#vb)' : 'none';
    const fv = `"wght" ${lerp(300, 900, q).toFixed(1)},"wdth" ${lerp(125, 100, q).toFixed(1)}`;
    for (const c of copies) { c.style.fontVariationSettings = fv; c.style.opacity = t >= TLk && c._k !== 0 ? 0 : 1; }
  });
  sfx(0, 'ratchet', TLk - .02);
  const A = () => anchor(copies.find(c => c._k === 0).querySelector('.pd')), tl = TLk + .02;
  seg(0, t1 + 5, flight(.2, tl, () => ({x: A().x, y: -60, d: 40}), A, [50, 15], {ease: 'lin'}));
  sfx(tl, 'thock', 0); sfx(tl + hopDur(50) + hopDur(15), 'knock', 1);
  S.stopped.A = A;
};

S.job = () => {
  const w = L.job.w, t0 = cut('job'), t1 = end('job');
  const sc = scene(t0, t1, OR);
  const el = T(sc, `<span class="w">That's</span><br><span class="w">the</span><br><span class="w">job${P(900)}</span>`, {x: 1720, y: 330, size: 250, w: 900, d: 62, align: 'right', lh: .86, col: OB});
  words(el).forEach((s, i) => hardIn(s, i ? w[i] - .04 : t0));
  const A = pdA(el), th = w[2] - .1, tl = w[2] + .12, hops = fitHops(tl, [26], t1);
  let p0 = null;
  // roll right along the old baseline while "job" is still hidden, then hop up onto its full stop from the right
  seg(t0, t1 + 5, t => {
    p0 = p0 || S.stopped.A(); const a = A();
    if (t < th) { const q = E.smooth(clamp01((t - t0) / (th - t0))); return {x: lerp(p0.x, a.x + 90, q), y: p0.y, d: lerp(p0.d, a.d, q)}; }
    return flight(th, tl, {x: a.x + 90, y: p0.y, d: a.d}, A, hops, {ease: 'lin'})(t);
  });
  sfx(tl, 'thock', 1); if (hops.length) sfx(tl + hopDur(26), 'knock', 2);
  DROP = t0; sfx(t0, 'drop');
  S.job.A = A;
};

S.ad = () => {
  const w = L.ad.w, t0 = cut('ad'), t1 = end('ad');
  const sc = scene(t0, t1, OB);
  const el = T(sc, W('This is an') + ` <span class="w">ad${P(500)}</span>`, {x: 128, y: 600, size: 108, w: 500, col: OW, ls: '-0.02em'});
  words(el).forEach((s, i) => cutIn(s, i ? w[i] - .03 : t0));
  const A = pdA(el), tl = w[3] + .14;
  seg(t0, t1 + 5, chain(t0, tl, S.job.A, A, [16], t1));
  sfx(tl, 'knock', 4);
  const svg = $('div', 'abs', sc, 'inset:0', `<svg width="1920" height="1080"><rect x="28" y="28" width="1864" height="1024" fill="none" stroke="${OR}" stroke-width="4"/></svg>`);
  const rc = svg.querySelector('rect'), per = 2 * (1864 + 1024); rc.style.strokeDasharray = per;
  const ts = w[3] + .02;
  HOOKS.push(t => { rc.style.strokeDashoffset = per * (1 - E.out(clamp01((t - ts) / .3))); });
  sfx(ts + .3, 'knock', 6);
  sfx(t0, 'mute', t1 - t0);
  S.ad.A = A;
};

S.made = () => {
  const w = L.made.w, t0 = cut('made'), tB = w[3] - .04, tC = w[5] - .04, t1 = end('made');
  // a) "Made from type,"  four mismatched axis settings snap into one voice
  const a = scene(t0, tB, OW);
  const mf = T(a, W('Made from'), {x: 128, y: 230, size: 96, w: 500, col: OB, ls: '-0.02em'});
  words(mf).forEach((s, i) => hardIn(s, i ? w[i] - .04 : t0, 14));
  const AX = [[900, 62], [100, 125], [500, 100], [900, 125], [800, 100]];
  const ty = T(a, 'type,'.split('').map(c => `<span class="w">${c}</span>`).join(''), {x: 100, y: 900, size: 520, w: 800, d: 100, col: OB, ls: '-0.03em'});
  const ti = w[2] - .05;
  cutIn(ty, ti); K(ty, 'o', [-1, 0]);
  words(ty).forEach((s, i) => { s._wg = AX[i][0]; s._wd = AX[i][1]; K(s, 'wg', [ti + .06, AX[i][0]], [ti + .36, 800, 'back']); K(s, 'wd', [ti + .06, AX[i][1]], [ti + .36, 100, 'back']); });
  sfx(ti, 'type'); sfx(ti + .3, 'knock', 2);
  seg(t0, tB, flight(t0, t0 + .55, S.ad.A, () => { const p = S.ad.A(); return {x: p.x + 120, y: 1180, d: p.d}; }, [], {ease: 'lin'}));  // the dot drops out of frame
  // b) "timing,"  a playhead sweeps a 16-step grid; the last step collapses into the dot
  const b = scene(tB, tC, OB);
  for (let i = 0; i < 16; i++) $('div', 'abs', b, `left:${128 + i * 104}px;top:150px;width:84px;height:560px;border-radius:10px;background:${OW};opacity:.07`);
  const lit = Array.from({length: 16}, (_, i) => { const l = $('div', 'abs', b, `left:${128 + i * 104}px;top:150px;width:84px;height:560px;border-radius:10px;background:${OR}`); const tt = tB + .06 + i * .048; K(l, 'o', [tt - .001, 0], [tt, 1, 'lin'], [tt + .14, 0, 'inn']); return l; });
  const tcol = tB + .06 + 15 * .048;
  K(lit[15], 'o', [tB + .06 + 15 * .048 - .001, 0], [tcol, 1, 'lin'], [tC - .14, 1], [tC - .06, 0, 'lin']);
  const tm = T(b, `<span class="w">timing,</span>`, {x: 120, y: 1000, size: 300, w: 300, it: true, col: OW});
  hardIn(words(tm)[0], tB);
  const BX = 128 + 15 * 104 + 42;
  seg(tB, tC, t => t < tC - .12 ? null : {x: BX, y: 430, d: lerp(84, 34, E.smooth(clamp01((t - (tC - .12)) / .1)))});
  sfx(tC - .12, 'knock', 5);
  // c) "and one orange dot."  push in, then the disk springs down to punctuation
  const c = scene(tC, t1, OB);
  const od = T(c, `<span class="w">one</span> <span class="w" style="color:${OR}">orange</span> <span class="w">dot${P(800)}</span>`, {x: 128, y: 950, size: 150, w: 800, col: OW});
  words(od).forEach((s, i) => hardIn(s, i ? w[i + 5] - .04 : tC));
  const A = pdA(od), td = w[7] + .02, tl = w[7] + .3;
  const disk = t => { const q = E.expo(clamp01((t - tC) / .34)); return {x: lerp(BX, 1330, q), y: lerp(430, 470, q), d: lerp(34, 600, q)}; };
  seg(tC, t1 + 5, t => {
    if (t < td) return disk(t);
    const P0 = disk(td), a = A();
    if (t < tl) { const q = clamp01((t - td) / (tl - td)), d = lerp(P0.d, a.d, E.expo(q)); return q < .45 ? {x: lerp(P0.x, a.x, E.out(q / .45)), y: lerp(P0.y, a.y - 160, E.out(q / .45)), d} : flight(td + .45 * (tl - td), tl, {x: a.x, y: a.y - 160, d: a.d}, A)(t); }
    return flight(td, tl, P0, A, fitHops(tl, [34], t1))(t);
  });
  sfx(tC, 'whoosh'); sfx(tl, 'thock', 1);
  S.made.A = A;
};

S.picture = () => {
  const w = L.picture.w, t0 = cut('picture'), t1 = end('picture');
  const sc = scene(t0, t1, OW);
  const np = T(sc, W('Now picture'), {x: 128, y: 270, size: 110, w: 500, col: OB, ls: '-0.025em'});
  words(np).forEach((s, i) => hardIn(s, i ? w[i] - .04 : t0, 14));
  const yb = T(sc, W('your business'), {x: 116, y: 630, size: 260, w: 900, d: 62, col: OB});
  words(yb).forEach((s, i) => hardIn(s, w[i + 2] - .04));
  const ii = T(sc, `<span class="w">in</span> <span class="w">it${P(300, true)}</span>`, {x: 1792, y: 880, size: 130, w: 300, it: true, align: 'right', col: OB});
  words(ii).forEach((s, i) => hardIn(s, w[i + 4] - .04, 14));
  // the dot rolls along an orange underline under "your business", then hops onto the period of "it."
  const ul = $('div', 'abs', sc, `left:124px;top:704px;height:12px;width:10px;background:${OR}`);
  const r0 = w[2] - .02, r1 = w[3] + .28, xs = 124, ROLLY = 704 - 16;
  let xe = 0; LATE.unshift(() => { if (!xe) xe = yb.offsetLeft + yb.offsetWidth - 8; });
  const roll = t => { const q = E.smooth(clamp01((t - r0) / (r1 - r0))); return {x: lerp(xs, xe, q), y: ROLLY, d: 30}; };
  HOOKS.push(t => { const r = roll(t); ul.style.width = Math.max(0, r.x - xs) + 'px'; ul.style.opacity = t >= r0 ? 1 : 0; });
  const A = pdA(ii), tl = w[5] + .02;
  const intro = flight(t0 + .02, r0, S.made.A, () => ({x: xs, y: ROLLY, d: 30}), []);
  seg(t0, t1 + 5, t => t < r0 ? intro(t) : t < r1 ? roll(t) : flight(r1, tl, roll(r1), A)(t));
  sfx(r0, 'knock', 2); sfx(tl, 'knock', 3);
