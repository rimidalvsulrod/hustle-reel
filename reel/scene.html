<!doctype html>
<html><head><meta charset="utf-8"><title>NEQO Ultra reel</title>
<!-- Motion graphics for the NEQO Digital Ultra reel. Driven by build/timeline.js (VO-synced word times);
     render.cjs calls window.build() once, then window.seek(t) per frame. -->
<style>
@font-face{font-family:I;src:url(build/fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:I;src:url(build/fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:I;src:url(build/fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:I;src:url(build/fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:I;src:url(build/fonts/Inter-900.ttf);font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#04050b;font-family:I,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#bg,#cam,#fx,.scene,.inner{position:absolute;inset:0}
.abs{position:absolute}
.glow{position:absolute;border-radius:50%}
.dot{position:absolute;left:0;top:0;border-radius:50%;background:#fff}
.hl{position:absolute;left:50px;right:50px;text-align:center;font-weight:800;font-size:96px;line-height:1.1;letter-spacing:-.035em}
.w{display:inline-block;padding:.04em .02em .12em;margin:0 -.02em;background:linear-gradient(180deg,#fff 40%,#b4b9c8);-webkit-background-clip:text;background-clip:text;color:transparent}
.w.g{background-image:linear-gradient(90deg,#3d8bff 0%,#8b5cf6 38%,#ec4899 70%,#ff7a3d 100%)}
.card{position:absolute;background:linear-gradient(180deg,rgba(30,31,40,.96),rgba(18,19,25,.96));border:2px solid rgba(255,255,255,.08);border-radius:40px;box-shadow:0 60px 140px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.05)}
.row{display:flex;align-items:center}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:10px 22px;font-weight:700}
</style></head>
<body><div id="bg"></div><div id="cam"></div><div id="fx"></div>
<script src="build/timeline.js"></script>
<script>
const TL = window.TL, BG = document.getElementById('bg'), CAM = document.getElementById('cam'), FX = document.getElementById('fx');
const GRAD = 'linear-gradient(90deg,#3d8bff 0%,#8b5cf6 38%,#ec4899 70%,#ff7a3d 100%)';
const gtxt = s => `<span style="background:${GRAD};-webkit-background-clip:text;background-clip:text;color:transparent">${s}</span>`;

// ---------------------------------------------------------------- tiny deterministic animation engine
const E = {lin: x => x, out: x => 1 - (1 - x) ** 3, inn: x => x ** 3, io: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  back: x => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2};
const ELS = new Map(), HOOKS = [], SFX = [], SHAKES = [], HLS = [];
const DEF = {x: 0, y: 0, s: 1, sx: 1, r: 0, o: 1, b: 0, sk: 0};
function K(el, prop, ...keys) {  // keys: [time, value, easing-into-this-key]
  let s = ELS.get(el); if (!s) ELS.set(el, s = {});
  (s[prop] = s[prop] || []).push(...keys); s[prop].sort((a, b) => a[0] - b[0]);
}
function val(k, t) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t < k[i][0]) {
    const [a, va] = k[i - 1], [b, vb, e] = k[i]; return va + (vb - va) * E[e || 'out']((t - a) / (b - a));
  }
  return k[k.length - 1][1];
}
function seek(t) {
  for (const [el, s] of ELS) {
    const v = {...DEF}; for (const p in s) v[p] = val(s[p], t);
    el.style.opacity = v.o; el.style.visibility = v.o < .002 ? 'hidden' : 'visible';
    el.style.transform = `translate(${v.x}px,${v.y}px) rotate(${v.r}deg) skewX(${v.sk}deg) scale(${v.s * v.sx},${v.s})`;
    el.style.filter = v.b > .05 ? `blur(${v.b.toFixed(2)}px)` : 'none';
  }
  let dx = 0, dy = 0;
  for (const [t0, a] of SHAKES) if (t >= t0) { const q = t - t0, d = a * Math.exp(-q * 9); dx += d * Math.sin(q * 71); dy += d * Math.cos(q * 53); }
  CAM.style.transform = `translate(${dx}px,${dy}px)`;
  for (const h of HOOKS) h(t);
}
function $(tag, cls, parent, css, html) {
  const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html != null) e.innerHTML = html;
  parent.appendChild(e); return e;
}
const sfx = (t, type, p = 0) => SFX.push([+t.toFixed(3), type, p]);
const clamp01 = x => Math.max(0, Math.min(1, x));
function reveal(el, t, d = .32, dy = 34) { K(el, 'o', [t, 0], [t + d * .6, 1]); K(el, 'b', [t, 14], [t + d, 0]); K(el, 'y', [t, dy], [t + d, 0]); }
function pop(el, t, from = .5, snd = 0) {
  K(el, 'o', [t, 0], [t + .1, 1]); K(el, 's', [t, from], [t + .42, 1, 'back']); K(el, 'b', [t, 8], [t + .2, 0]);
  if (snd !== null) sfx(t, 'pop', snd);
}
function slide(el, t, dx, dy, d = .5) { K(el, 'o', [t, 0], [t + .2, 1]); K(el, 'x', [t, dx], [t + d, 0]); K(el, 'y', [t, dy], [t + d, 0]); K(el, 'b', [t, 12], [t + .3, 0]); }
function flash(t, a = .6) {
  const f = $('div', 'abs', FX, 'inset:0;background:radial-gradient(circle at 50% 45%,#fff,rgba(190,200,255,.55) 35%,transparent 75%)');
  K(f, 'o', [t, 0], [t + .03, a, 'lin'], [t + .4, 0]);
}
const shake = (t, a) => SHAKES.push([t, a]);
function typeText(el, txt, t0, t1) { HOOKS.push(t => { el.textContent = txt.slice(0, Math.round(clamp01((t - t0) / (t1 - t0)) * txt.length)); }); }
function count(el, a, b, t0, t1) { HOOKS.push(t => { el.textContent = Math.round(a + (b - a) * E.out(clamp01((t - t0) / (t1 - t0)))).toLocaleString('en-US'); }); }

// headline: tokens split on spaces, '|' = line break, *...* = gradient words; ws[i] = reveal time of word i
function headline(p, txt, ws, top, size = 96, css = '') {
  const el = $('div', 'hl', p, `top:${top}px;font-size:${size}px;${css}`), words = [];
  let g = false;
  for (const tok of txt.split(' ')) {
    if (tok === '|') { $('br', null, el); continue; }
    let w = tok; if (w[0] === '*') { g = true; w = w.slice(1); }
    const end = w.endsWith('*'); if (end) w = w.slice(0, -1);
    const sp = $('span', 'w' + (g ? ' g' : ''), el); sp.textContent = w; words.push(sp);
    el.appendChild(document.createTextNode(' '));
    if (end) g = false;
  }
  words.forEach((w, i) => ws[i] != null && reveal(w, ws[i] - .06));
  HLS.push(el); return {el, words};
}
function fixGradients() {  // one continuous gradient across each highlighted phrase
  for (const el of HLS) {
    const gs = [...el.querySelectorAll('.w.g')]; if (!gs.length) continue;
    const L = Math.min(...gs.map(g => g.offsetLeft)), R = Math.max(...gs.map(g => g.offsetLeft + g.offsetWidth));
    for (const g of gs) { g.style.backgroundSize = `${R - L}px 100%`; g.style.backgroundPosition = `${L - g.offsetLeft}px 0`; }
  }
}

// ---------------------------------------------------------------- background: nebula glows + drifting particles
function buildBG() {
  const G = [[-420, -300, 1500, 'rgba(37,99,235,.42)'], [380, 900, 1500, 'rgba(126,34,206,.36)'],
             [-500, 1250, 1300, 'rgba(219,39,119,.2)'], [500, -500, 1100, 'rgba(14,165,233,.16)']]
    .map(([x, y, d, c]) => $('div', 'glow', BG, `left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:radial-gradient(circle,${c} 0%,transparent 65%)`));
  let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const P = [];
  for (let i = 0; i < 90; i++) {
    const big = i < 14, sz = big ? 30 + rnd() * 70 : 2 + rnd() * 4;
    const d = $('div', 'dot', BG, `width:${sz}px;height:${sz}px;` + (big
      ? `background:radial-gradient(circle,rgba(${rnd() < .5 ? '140,120,255' : '255,90,160'},.16),transparent 70%)`
      : `opacity:${.2 + rnd() * .6};box-shadow:0 0 ${sz * 2}px rgba(160,170,255,.8)`));
    P.push({d, x: rnd() * 1080, y: rnd() * 1920, vx: (rnd() - .5) * 14, vy: -6 - rnd() * 22});
  }
  $('div', 'abs', BG, 'inset:0;background:radial-gradient(ellipse 80% 65% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%)');
  HOOKS.push(t => {
    G.forEach((g, i) => g.style.transform = `translate(${Math.sin(t * .25 + i * 1.7) * 90}px,${Math.cos(t * .2 + i) * 70}px) scale(${1 + .08 * Math.sin(t * .3 + i)})`);
    for (const p of P) p.d.style.transform = `translate(${((p.x + p.vx * t) % 1080 + 1080) % 1080}px,${((p.y + p.vy * t) % 1920 + 1920) % 1920}px)`;
  });
}

// ---------------------------------------------------------------- scenes (one per VO line)
function scene(t0, t1) {
  const sc = $('div', 'scene', CAM), inner = $('div', 'inner', sc), first = t0 <= .001, last = t1 >= TL.total - .001;
  K(sc, 'o', [t0 - (first ? 0 : .04), first ? 1 : 0], [t0 + .16, 1]);
  if (!first) { K(sc, 's', [t0 - .04, 1.07], [t0 + .26, 1]); K(sc, 'b', [t0 - .04, 16], [t0 + .2, 0]); sfx(t0, 'whoosh'); }
  if (!last) { K(sc, 'o', [t1 - .12, 1], [t1 + .06, 0, 'inn']); K(sc, 's', [t1 - .12, 1], [t1 + .06, .93, 'inn']); K(sc, 'b', [t1 - .12, 0], [t1 + .06, 14, 'inn']); }
  K(inner, 's', [t0, 1], [t1, 1.03, 'lin']);
  return inner;
}
function logo(p, y0, sc) {  // lockup cut from the previous reel's end card (840x750 source canvas)
  return [['logo_n', 260, 292, 35], ['logo_neqo', 750, 45, 395], ['logo_digital', 540, 150, 632]].map(([f, w, x, y]) => {
    const im = $('img', 'abs', p, `left:${540 + (x - 420) * sc}px;top:${y0 + y * sc}px;width:${w * sc}px`); im.src = `assets/${f}.png`; return im;
  });
}
const STAR = '<svg viewBox="0 0 24 24" width="100%" height="100%" style="filter:drop-shadow(0 0 14px rgba(251,191,36,.55))"><path fill="#fbbf24" d="M12 2.2l2.95 6.2 6.8.8-5 4.7 1.3 6.75L12 17.3l-6.05 3.35 1.3-6.75-5-4.7 6.8-.8z"/></svg>';

const S = {};
S.run = (p, l) => {
  headline(p, 'You run the | *business.*', l.w, 700, 128);
  const row = $('div', 'abs row', p, 'left:0;right:0;top:1040px;justify-content:center;gap:20px');
  for (let i = 0; i < 5; i++) pop($('div', '', row, 'width:92px;height:92px', STAR), l.w[3] + .1 + i * .065, .2, i);
};

S.who = (p, l, t0, t1) => {
  headline(p, "But who's running | your *marketing?*", l.w, 250, 94);
  const c = $('div', 'card', p, 'left:90px;top:620px;width:900px;padding:40px 48px 26px');
  $('div', 'row', c, 'justify-content:space-between;margin-bottom:14px', '<div style="font-weight:700;font-size:42px">Marketing to-do</div><div class="pill" style="background:rgba(239,68,68,.16);color:#ff6b6b;font-size:28px">5 overdue</div>');
  slide(c, t0 + .05, 0, 120, .55);
  [['Update the website', '6 months late'], ['Post on social', 'Last post: March'], ['Fix Google listing', 'Not ranking'],
   ['Reply to reviews', '14 waiting'], ['Run ads', 'Never started']].forEach(([a, b], i) => {
    const r = $('div', 'row', c, 'height:110px;border-top:2px solid rgba(255,255,255,.06);gap:26px',
      `<div style="width:46px;height:46px;border:4px solid #4b5063;border-radius:12px;flex:none"></div><div style="font-weight:600;font-size:38px;flex:1">${a}</div><div class="pill" style="background:rgba(239,68,68,.14);color:#ff7b7b;font-size:27px;padding:8px 18px">${b}</div>`);
    slide(r, t0 + .3 + i * .13, -50, 0, .35); sfx(t0 + .3 + i * .13, 'tick', i);
  });
  const g = t1 - .3;  // glitch out into the drop
  K(p, 'x', [g, 0], [g + .05, -28, 'lin'], [g + .1, 22, 'lin'], [g + .15, -14, 'lin'], [g + .2, 10, 'lin'], [g + .25, 0, 'lin']);
  K(p, 'sk', [g, 0], [g + .05, 9, 'lin'], [g + .1, -7, 'lin'], [g + .15, 5, 'lin'], [g + .25, 0, 'lin']);
  sfx(g, 'glitch');
};

S.meet = (p, l, t0) => {
  const burst = $('div', 'abs', p, 'left:-460px;top:-60px;width:2000px;height:2000px;border-radius:50%;background:radial-gradient(circle,rgba(170,190,255,.6) 0%,rgba(120,90,255,.28) 22%,transparent 58%)');
  K(burst, 's', [t0, .1], [t0 + .8, 1.25]); K(burst, 'o', [t0, 1], [t0 + 1, 0]);
  const ring = $('div', 'abs', p, 'left:240px;top:640px;width:600px;height:600px;border-radius:50%;border:5px solid rgba(170,185,255,.8);box-shadow:0 0 60px rgba(140,120,255,.9),inset 0 0 60px rgba(140,120,255,.6)');
  K(ring, 's', [t0, .15], [t0 + .9, 2.8]); K(ring, 'o', [t0, 1], [t0 + .9, 0]);
  K($('div', 'abs', p, 'left:90px;top:390px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(80,100,255,.32),transparent 62%)'), 'o', [t0, 0], [t0 + .5, 1]);
  flash(t0, .75); shake(t0, 16); sfx(t0, 'drop'); sfx(t0, 'impact', 1);
  const [n, neqo, dig] = logo(p, 380, 1), w = l.w;
  K(n, 'o', [w[0] - .05, 0], [w[0] + .1, 1]); K(n, 's', [w[0] - .05, .4], [w[0] + .45, 1, 'back']); K(n, 'b', [w[0] - .05, 20], [w[0] + .25, 0]);
  reveal(neqo, w[1] - .05, .4, 40); K(neqo, 'sx', [w[1] - .05, 1.12], [w[1] + .4, 1]);
  K(dig, 'o', [w[2] - .05, 0], [w[2] + .2, 1]); K(dig, 'sx', [w[2] - .05, 1.35], [w[2] + .45, 1]);
  const u = $('div', 'abs row', p, 'left:0;right:0;top:1190px;justify-content:center');
  pop($('div', '', u, `padding:4px;border-radius:999px;background:${GRAD};box-shadow:0 0 60px rgba(139,92,246,.55)`,
    '<div style="background:#0b0c14;border-radius:999px;padding:20px 56px 20px 72px;font-weight:800;font-size:54px;letter-spacing:.3em">ULTRA</div>'), w[3] - .04, .3, 5);
  flash(w[3], .25);
};

S.team = (p, l) => {
  headline(p, 'A full *marketing team,* | working for you | every month.', l.w, 230, 90);
  [['🎨', 'Web design', '#3b82f6,#8b5cf6'], ['📍', 'Local SEO', '#10b981,#3b82f6'], ['📱', 'Social media', '#ec4899,#f97316'], ['📊', 'Strategy', '#8b5cf6,#ec4899']].forEach(([e, name, bg], i) => {
    const c = $('div', 'card', p, `left:${100 + (i % 2) * 450}px;top:${610 + Math.floor(i / 2) * 360}px;width:430px;height:330px;padding:40px;border-radius:36px`,
      `<div style="width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,${bg});display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 10px 40px rgba(0,0,0,.4)">${e}</div>
       <div style="font-weight:700;font-size:42px;margin-top:30px">${name}</div>
       <div class="row" style="margin-top:12px;font-weight:600;font-size:27px;color:#7ee2a8;gap:12px"><span style="width:14px;height:14px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399"></span>Working on it</div>`);
    pop(c, l.w[2] + i * .12, .6, i);
  });
  reveal($('div', 'abs', p, 'left:0;right:0;top:1350px;text-align:center;font-weight:600;font-size:36px;color:#aab0c2', 'One team for your website, search &amp; ads.'), l.w[4]);
};

S.web = (p, l, t0) => {
  headline(p, 'A custom *website.*', l.w, 250, 108);
  const ph = $('div', 'abs', p, 'left:290px;top:440px;width:500px;height:1010px;border-radius:78px;background:#0d0e13;border:3px solid #2c2e3a;padding:16px;box-shadow:0 60px 140px rgba(0,0,0,.75)',
   `<div style="height:100%;border-radius:62px;background:#f6f7fb;overflow:hidden;color:#0f172a">
      <div class="row" style="justify-content:space-between;padding:22px 40px 0;font-weight:700;font-size:22px">9:41<span style="width:120px;height:30px;border-radius:20px;background:#0d0e13"></span><span style="letter-spacing:2px">•••</span></div>
      <div class="row" style="padding:22px 30px 10px;gap:14px"><div style="width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center">N</div><div style="font-weight:800;font-size:32px;flex:1">Northline</div><div style="width:34px;height:4px;background:#0f172a;box-shadow:0 10px 0 #0f172a,0 -10px 0 #0f172a"></div></div>
      <div style="margin:10px 30px 0;display:inline-block;background:#dcfce7;color:#15803d;font-weight:700;font-size:21px;padding:8px 16px;border-radius:999px">● Available now · 24/7</div>
      <div style="padding:18px 30px 0;font-weight:800;font-size:58px;line-height:1.02;letter-spacing:-.035em">Fast, honest plumbing. <span style="color:#f97316">Day or night.</span></div>
      <div style="margin:26px 30px 0;height:86px;border-radius:22px;background:#1e3a8a;color:#fff;font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:center">Book a visit</div>
      <div style="margin:24px 30px 0;height:240px;border-radius:26px;background:linear-gradient(135deg,#1e3a8a,#3b82f6 50%,#f59e0b);position:relative"><div style="position:absolute;left:16px;bottom:16px;background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:20px">Next available · Today 2:30 PM</div></div>
      <div style="padding:20px 30px 0;font-weight:700;font-size:24px"><span style="color:#f59e0b">★★★★★</span> 4.9 · 212 local reviews</div>
    </div>`);
  slide(ph, t0 + .02, 0, 300, .6);
  const toast = $('div', 'card row', p, 'left:50px;top:820px;width:640px;padding:26px 30px;gap:24px;border-radius:30px',
    '<div style="width:66px;height:66px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:38px;color:#052e16;flex:none">✓</div><div><div style="font-weight:700;font-size:32px">New booking</div><div style="font-weight:500;font-size:25px;color:#a7adbd;margin-top:4px">Water heater install · Today 2:30 PM</div></div>');
  slide(toast, l.w[1] + .1, -140, 0, .45); sfx(l.w[1] + .1, 'pop', 3);
};

S.seo = (p, l, t0) => {
  headline(p, 'Local SEO to rank | *higher on Google.*', l.w, 230, 92);
  const c = $('div', 'card', p, 'left:70px;top:500px;width:940px;height:920px;overflow:hidden');
  $('div', 'row', c, 'height:78px;padding:0 30px;gap:12px;border-bottom:2px solid rgba(255,255,255,.06)',
    '<span style="width:18px;height:18px;border-radius:50%;background:#ff5f57"></span><span style="width:18px;height:18px;border-radius:50%;background:#febc2e"></span><span style="width:18px;height:18px;border-radius:50%;background:#28c840"></span><div style="margin-left:90px;width:560px;height:44px;border-radius:12px;background:#0d0e13;color:#8b90a0;font-weight:500;font-size:22px;display:flex;align-items:center;justify-content:center">search</div>');
  const sb = $('div', 'row', c, 'margin:28px 30px;height:96px;border-radius:48px;background:#0d0e13;border:2px solid rgba(255,255,255,.1);padding:0 34px;gap:20px;font-weight:600;font-size:38px',
    '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9aa0b2" stroke-width="2.6"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg><span class="q"></span><span style="width:3px;height:44px;background:#60a5fa;margin-left:-14px"></span>');
  typeText(sb.querySelector('.q'), 'plumber near me', t0 + .1, t0 + .6);
  const list = $('div', 'abs', c, 'left:30px;right:30px;top:232px;height:660px'), RH = 132, wu = l.w[4];
  const row = (name, color, sub, i) => $('div', 'abs row', list, `left:0;right:0;top:${i * RH}px;height:${RH - 12}px;padding:0 24px;gap:24px;border-radius:26px`,
    `<div style="width:76px;height:76px;border-radius:20px;background:${color};flex:none"></div>
     <div style="flex:1"><div style="font-weight:700;font-size:36px">${name}</div><div style="font-weight:500;font-size:24px;color:#9aa0b2;margin-top:6px"><span style="color:#fbbf24">★★★★★</span> ${sub}</div></div>`);
